amcl:
  ros__parameters:
    use_sim_time: true
    
    # 1. Coordinate Frames
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    
    # 2. Stage Simulator Laser Topic
    # (Stage usually publishes on /base_scan or /scan. Change this if needed)
    scan_topic: "base_scan" 
    
    # 3. Initial Pose (Where the robot spawns in cave.world)
    set_initial_pose: true
    initial_pose: 
      x: -7.0
      y: -7.0
      yaw: 0.7854  # 45 degrees in radians
      
    # 4. Particle Filter settings
    max_particles: 1000
    min_particles: 100
    
    # Odometry Model (Assume basic differential drive)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.5
    alpha4: 0.5

    update_min_d: 0.02
    update_min_a: 0.02
    z_hit: 0.9
    sigma_hit: 0.05